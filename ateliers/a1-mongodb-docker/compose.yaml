services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Port hôte 27018 : 27017 est déjà pris par un MongoDB natif sur le poste.
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
